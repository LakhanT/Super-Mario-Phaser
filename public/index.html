<!DOCTYPE html>
<html>
<head>
    <title>Super Mario</title>
    <link rel="stylesheet" href="/css/main.css?v=9"/>
    <script type="module" src="/js/main.js?v=9"></script>
</head>
<body>
    <canvas id="screen" width="432" height="240"></canvas>
    <p id="pad-status">Xbox: press A once so the browser can see the pad</p>
    <div id="boot">
        <div class="boot-card">
            <h1>Super Mario</h1>
            <p id="boot-status">Click Play to start</p>
            <button id="play" type="button">Play</button>
            <p class="boot-keys">Move: arrows or stick. Jump: Space or A.<br>Run and fire: Shift or B. Open ? blocks for coins, mushrooms, flowers, and stars.</p>
        </div>
    </div>
    <script>
        setTimeout(() => {
            if (!window.__marioReady) {
                const status = document.getElementById('boot-status');
                if (status) {
                    status.textContent = 'Game files did not load. Open http://localhost:5000';
                }
            }
        }, 8000);

        function pollPad() {
            try {
                const boot = document.getElementById('boot');
                const play = document.getElementById('play');
                const status = document.getElementById('pad-status');
                let connected = false;
                const pads = navigator.getGamepads ? navigator.getGamepads() : [];
                for (const pad of pads) {
                    if (!pad || !pad.connected) {
                        continue;
                    }
                    connected = true;
                    const button = pad.buttons && pad.buttons[0];
                    const pressed = button && (button.pressed || button.value > 0.5);
                    if (pressed && boot && !boot.hidden && play && !play.hidden && !play.disabled) {
                        play.click();
                    }
                }
                if (status && boot && !boot.hidden) {
                    status.textContent = connected
                        ? 'Xbox connected. Press A or click Play.'
                        : 'Xbox: press A once so the browser can see the pad';
                }
            } catch (error) {}
            requestAnimationFrame(pollPad);
        }
        requestAnimationFrame(pollPad);
    </script>
</body>
</html>
